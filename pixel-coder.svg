<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pixel art: Ishita coding with her robot buddy</title>

  <!-- twinkling stars -->
  <g fill="#fde68a">
    <rect x="24" y="24" width="8" height="8"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="150" y="16" width="8" height="8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="340" y="24" width="8" height="8"><animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="400" y="40" width="8" height="8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="456" y="24" width="8" height="8"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="456" y="120" width="8" height="8"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="24" y="104" width="8" height="8"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ground -->
  <rect x="0" y="232" width="480" height="8" fill="#334155"/>
  <g fill="#475569">
    <rect x="16" y="232" width="8" height="4"/><rect x="88" y="236" width="8" height="4"/>
    <rect x="200" y="232" width="8" height="4"/><rect x="312" y="236" width="8" height="4"/>
    <rect x="424" y="232" width="8" height="4"/>
  </g>

  <!-- desk -->
  <rect x="176" y="200" width="240" height="8" fill="#a16207"/>
  <rect x="176" y="208" width="240" height="4" fill="#854d0e"/>
  <rect x="184" y="212" width="8" height="20" fill="#713f12"/>
  <rect x="400" y="212" width="8" height="20" fill="#713f12"/>

  <!-- monitor -->
  <rect x="192" y="72" width="160" height="104" fill="#1e293b"/>
  <rect x="200" y="80" width="144" height="88" fill="#0b1020"/>
  <rect x="264" y="176" width="16" height="16" fill="#475569"/>
  <rect x="240" y="192" width="64" height="8" fill="#64748b"/>
  <rect x="268" y="170" width="8" height="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></rect>

  <!-- code being typed -->
  <rect x="208" y="92" width="0" height="8" fill="#4ade80"><animate attributeName="width" values="0;80;80;80;0" keyTimes="0;0.25;0.8;0.95;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
  <rect x="216" y="108" width="0" height="8" fill="#60a5fa"><animate attributeName="width" values="0;72;72;72;0" keyTimes="0;0.25;0.8;0.95;1" dur="6s" begin="0.6s" repeatCount="indefinite"/></rect>
  <rect x="216" y="124" width="0" height="8" fill="#f472b6"><animate attributeName="width" values="0;64;64;64;0" keyTimes="0;0.25;0.8;0.95;1" dur="6s" begin="1.2s" repeatCount="indefinite"/></rect>
  <rect x="208" y="140" width="0" height="8" fill="#fbbf24"><animate attributeName="width" values="0;48;48;48;0" keyTimes="0;0.25;0.8;0.95;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
  <rect x="208" y="154" width="8" height="8" fill="#e2e8f0"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>

  <!-- tiny live bar chart on screen -->
  <rect x="306" y="144" width="8" height="16" fill="#4ade80"><animate attributeName="y" values="144;120;136;144" dur="3s" repeatCount="indefinite"/><animate attributeName="height" values="16;40;24;16" dur="3s" repeatCount="indefinite"/></rect>
  <rect x="318" y="128" width="8" height="32" fill="#60a5fa"><animate attributeName="y" values="128;144;112;128" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="height" values="32;16;48;32" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
  <rect x="330" y="136" width="8" height="24" fill="#f472b6"><animate attributeName="y" values="136;112;128;136" dur="3s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="height" values="24;48;32;24" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>

  <!-- speech bubble -->
  <g>
    <animate attributeName="opacity" values="1;1;0.6;1" dur="3s" repeatCount="indefinite"/>
    <rect x="212" y="12" width="108" height="32" fill="#111827"/>
    <rect x="216" y="16" width="100" height="24" fill="#f8fafc"/>
    <rect x="212" y="44" width="8" height="8" fill="#111827"/>
    <rect x="216" y="40" width="8" height="8" fill="#f8fafc"/>
    <text x="224" y="32" font-family="monospace" font-size="12" font-weight="bold" fill="#111827">hello, world!</text>
  </g>

  <!-- ===== character ===== -->
  <!-- legs -->
  <rect x="72" y="184" width="16" height="40" fill="#1e293b"/>
  <rect x="104" y="184" width="16" height="40" fill="#1e293b"/>
  <rect x="64" y="224" width="24" height="8" fill="#f8fafc"/>
  <rect x="104" y="224" width="24" height="8" fill="#f8fafc"/>

  <!-- hoodie body + left arm -->
  <rect x="64" y="104" width="64" height="80" fill="#3b82f6"/>
  <rect x="48" y="112" width="16" height="56" fill="#3b82f6"/>
  <rect x="48" y="168" width="16" height="16" fill="#f2b48a"/>
  <rect x="80" y="152" width="32" height="16" fill="#2f6fd6"/>
  <rect x="88" y="104" width="4" height="24" fill="#f8fafc"/>
  <rect x="100" y="104" width="4" height="24" fill="#f8fafc"/>
  <rect x="108" y="120" width="8" height="8" fill="#fbbf24"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></rect>

  <!-- neck + face -->
  <rect x="88" y="96" width="16" height="8" fill="#f2b48a"/>
  <rect x="64" y="56" width="64" height="40" fill="#f2b48a"/>

  <!-- hair -->
  <g fill="#2b1b17">
    <rect x="64" y="32" width="64" height="8"/>
    <rect x="56" y="40" width="80" height="16"/>
    <rect x="56" y="56" width="8" height="64"/>
    <rect x="128" y="56" width="8" height="64"/>
    <rect x="64" y="56" width="24" height="8"/>
    <rect x="104" y="56" width="24" height="8"/>
  </g>

  <!-- eyes, blush, smile -->
  <rect x="72" y="72" width="8" height="8" fill="#1a1a2e"/>
  <rect x="112" y="72" width="8" height="8" fill="#1a1a2e"/>
  <rect x="72" y="72" width="8" height="8" fill="#f2b48a" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="112" y="72" width="8" height="8" fill="#f2b48a" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="64" y="80" width="8" height="8" fill="#f28b82" opacity="0.8"/>
  <rect x="120" y="80" width="8" height="8" fill="#f28b82" opacity="0.8"/>
  <rect x="88" y="88" width="16" height="4" fill="#b5483f"/>

  <!-- waving right arm (rotates around the shoulder) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-120 136 112;-155 136 112;-120 136 112" dur="0.9s" repeatCount="indefinite"/>
    <rect x="128" y="112" width="16" height="48" fill="#3b82f6"/>
    <rect x="128" y="160" width="16" height="16" fill="#f2b48a"/>
  </g>

  <!-- ===== robot buddy ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="2s" repeatCount="indefinite"/>
    <rect x="410" y="72" width="8" height="8" fill="#f87171"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="412" y="80" width="4" height="8" fill="#94a3b8"/>
    <rect x="392" y="88" width="48" height="32" fill="#94a3b8"/>
    <rect x="400" y="98" width="8" height="8" fill="#22d3ee"/>
    <rect x="424" y="98" width="8" height="8" fill="#22d3ee"/>
    <rect x="404" y="110" width="24" height="4" fill="#1e293b"/>
    <rect x="396" y="120" width="40" height="32" fill="#64748b"/>
    <rect x="408" y="130" width="16" height="8" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="388" y="124" width="8" height="20" fill="#94a3b8"/>
    <rect x="436" y="124" width="8" height="20" fill="#94a3b8"/>
    <rect x="408" y="152" width="16" height="8" fill="#fb923c"><animate attributeName="opacity" values="1;0.3;1" dur="0.4s" repeatCount="indefinite"/></rect>
    <rect x="412" y="160" width="8" height="8" fill="#fde047"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.4s" repeatCount="indefinite"/></rect>
  </g>
</svg>
